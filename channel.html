<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaîne — AfroFlix</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/mobile.css"><style>.wrap{max-width:1200px;margin:auto;padding:35px 22px 70px}.player{background:#050507;aspect-ratio:16/9;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.player video{width:100%;height:100%;object-fit:contain}.schedule{display:grid;gap:10px;margin-top:25px}.program{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}.live{color:#fff;background:#a00;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.muted{color:var(--muted)}button{cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script></head><body><header class="topbar"><a class="brand" href="/">AFRO<span>FLIX</span></a><nav><a href="/channels.html">← Chaînes</a><a href="/films.html">Films</a></nav></header><main class="wrap" id="app">Chargement…</main><script>const slug=new URLSearchParams(location.search).get('slug');let data;fetch('/api/channels/'+encodeURIComponent(slug||'')).then(r=>r.ok?r.json():Promise.reject()).then(x=>{data=x;const c=x.channel;document.title=c.name+' — AfroFlix';const video=c.stream_url?`<video id="afroVideo" controls autoplay playsinline muted></video>`:`<div><div style="font-size:70px">${c.logo_url||'📺'}</div><h2>Chaîne prête pour le direct</h2><p class="muted">La source de diffusion n'est pas encore configurée.</p></div>`;document.querySelector('#app').innerHTML=`<p class="eyebrow">${c.category}</p><h1>${c.name} ${c.is_live?'<span class="live">● EN DIRECT</span>':''}</h1><p class="muted">${c.description||''}</p><div class="player">${video}</div><p><button class="btn gold" onclick="follow()">＋ Suivre la chaîne</button></p><h2>Programme TV</h2><div class="schedule">${(x.programs||[]).map(p=>`<div class="program"><b>${new Date(p.start_time).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</b> → ${new Date(p.end_time).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}<br><strong>${p.title}</strong><div class="muted">${p.program_type||''} ${p.description?'· '+p.description:''}</div></div>`).join('')||'<p class="muted">Aucun programme planifié pour le moment.</p>'}</div>`}).then(()=>{const v=document.getElementById('afroVideo');if(!v||!data?.channel?.stream_url)return;const src=data.channel.stream_url;if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;}else if(window.Hls&&Hls.isSupported()){const hls=new Hls({lowLatencyMode:true});hls.loadSource(src);hls.attachMedia(v);}else{v.outerHTML='<p class="muted">Ce navigateur ne prend pas en charge HLS.</p>';}}).catch(()=>document.querySelector('#app').innerHTML='<h1>Chaîne introuvable</h1><p><a href="/channels.html">Retour aux chaînes</a></p>');async function follow(){if(!data)return;const token=localStorage.getItem('token');if(!token){alert('Connecte-toi pour suivre une chaîne.');return}const r=await fetch('/api/channels/'+data.channel.id+'/follow',{method:'POST',headers:{Authorization:'Bearer '+token}});alert(r.ok?'Chaîne suivie !':'Connexion requise.');}</script></body></html>
