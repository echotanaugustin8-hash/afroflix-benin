services:
  afroflix:
    build: .
    restart: unless-stopped
    env_file: .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\'http://localhost:3000/api/health\').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - web
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    ports:
      - "1935:1935"
      - "8888:8888"
    networks:
      - web
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      afroflix:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - web
networks:
  web:
